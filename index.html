              <p style={{ color: text, fontSize: 14, fontWeight: 600, marginBottom: 16 }}>🔒 Crea tu nueva contraseña</p>

              {/* New password */}
              <div style={{ position: "relative", marginBottom: 8 }}>
                <input placeholder="Nueva contraseña" type={showNew ? "text" : "password"} value={newPass} onChange={e => { setNewPass(e.target.value); setError(""); }}
                  style={{ display: "block", width: "100%", background: inputBg, border: `1px solid ${newPass ? (strength >= 2 ? "#10b98150" : "#f59e0b50") : border}`, borderRadius: 12, padding: "14px 60px 14px 14px", color: text, fontSize: 14, fontFamily: "'DM Sans',sans-serif", outline: "none" }}
                />
                <button onClick={() => setShowNew(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: textSub, fontSize: 12, cursor: "pointer" }}>
                  {showNew ? "Ocultar" : "Ver"}
                </button>
              </div>

              {/* Strength bar */}
              {newPass && (
                <div style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", gap: 4, marginBottom: 4 }}>
                    {[1,2,3,4].map(i => (
                      <div key={i} style={{ flex: 1, height: 3, borderRadius: 99, transition: "background .3s", background: newPass.length >= i * 2 ? (i <= 2 ? "#f59e0b" : "#10b981") : border }} />
                    ))}
                  </div>
                  <p style={{ color: textSub, fontSize: 11 }}>{newPass.length < 6 ? "Contraseña débil" : newPass.length < 10 ? "Moderada" : "Fuerte ✓"}</p>
                </div>
              )}

              {/* Confirm password */}
              <div style={{ position: "relative", marginBottom: 8 }}>
                <input placeholder="Confirmar nueva contraseña" type={showConfirm ? "text" : "password"} value={confirm} onChange={e => { setConfirm(e.target.value); setError(""); }}
                  style={{ display: "block", width: "100%", background: inputBg, border: `1px solid ${!confirm ? border : passwordsMatch ? "#10b98150" : "#ef444450"}`, borderRadius: 12, padding: "14px 60px 14px 14px", color: text, fontSize: 14, fontFamily: "'DM Sans',sans-serif", outline: "none" }}
                />
                <button onClick={() => setShowConfirm(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: textSub, fontSize: 12, cursor: "pointer" }}>
                  {showConfirm ? "Ocultar" : "Ver"}
                </button>
              </div>
              {confirm && (
                <p style={{ color: passwordsMatch ? "#10b981" : "#ef4444", fontSize: 12, marginBottom: 4 }}>
                  {passwordsMatch ? "✓ Las contraseñas coinciden" : "✗ Las contraseñas no coinciden"}
                </p>
              )}
              {error && <p style={{ color: "#ef4444", fontSize: 12, marginTop: 4 }}>{error}</p>}
            </div>

            <button onClick={function() {
              if (!newPass || newPass.length < 6) { setError("La contraseña debe tener al menos 6 caracteres"); return; }
              if (!passwordsMatch) { setError("Las contraseñas no coinciden"); return; }
              setError("");
              fetch("https://uwtclxtywhthwecsqeug.supabase.co/functions/v1/reset-password", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dGNseHR5d2h0aHdlY3NxZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTE1NDQsImV4cCI6MjA5NjYyNzU0NH0.wQ-I3d1P_FaPe4kq2mV_Nm_j7hE7PUOdx_VKVxl7PQQ",
                },
                body: JSON.stringify({ email: email, new_password: newPass }),
              }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.success) { setStep("success"); }
                else { setError(res.error || "Error al actualizar contraseña"); }
              }).catch(function() { setStep("success"); });
            }} className="btn-glow" style={{ width: "100%", background: (newPass && passwordsMatch) ? accentGrad : (darkMode ? "#ffffff10" : "#e2e8f0"), border: "none", borderRadius: 16, padding: "18px", color: (newPass && passwordsMatch) ? "white" : textSub, fontSize: 16, fontWeight: 700, cursor: (newPass && passwordsMatch) ? "pointer" : "not-allowed", fontFamily: "'DM Sans',sans-serif", transition: "all .3s" }}>
              Restablecer contraseña
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function LoginScreen({ onBack, onLogin, onMasterLogin, onRegister, darkMode = true }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPass, setShowPass] = useState(false);
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);
  const [step, setStep] = useState("form"); // form | verify2fa
  const [showForgot, setShowForgot] = useState(false);
  const [code, setCode] = useState(["", "", "", "", "", ""]);
  const ref0 = useRef(); const ref1 = useRef(); const ref2 = useRef();
  const ref3 = useRef(); const ref4 = useRef(); const ref5 = useRef();
  const codeRefs = [ref0, ref1, ref2, ref3, ref4, ref5];
  const canLogin = email && password;
  const codeJoined = code.join("");
  const [codeHash, setCodeHash] = useState("");
  const codeComplete = codeJoined.length === 6;
  const codeCorrect = codeHash === H_2FA;

  if (showForgot) return <ForgotPasswordScreen onBack={() => setShowForgot(false)} darkMode={darkMode} />;

  const bg      = darkMode ? "#0a0f1e"   : "#f8fafc";
  const navBg   = darkMode ? "linear-gradient(135deg, #0d1f3c, #0a0f1e)" : "linear-gradient(135deg, #dbeafe, #f8fafc)";
  const text    = darkMode ? "white"     : "#0f172a";
  const textSub = darkMode ? "#64748b"   : "#64748b";
  const inputBg = darkMode ? "#ffffff08" : "#ffffff";
  const border  = (active) => active ? "#3b82f650" : (darkMode ? "#ffffff15" : "#e2e8f0");
  const errBdr  = "#ef444450";
  const codeBg  = (c) => c ? (darkMode ? "#8b5cf615" : "#f3f0ff") : inputBg;
  const codeBdr = (c) => c ? "#8b5cf6" : (darkMode ? "#ffffff15" : "#e2e8f0");

  const handleCodeInput = (i, val) => {
    if (!/^\d?$/.test(val)) return;
    const next = [...code]; next[i] = val; setCode(next);
    if (val && i < 5) codeRefs[i + 1].current.focus();
    const newCode = [...code]; newCode[i] = val;
    const joined = newCode.join("");
    if (joined.length === 6) sha256(joined).then(h => setCodeHash(h));
    else setCodeHash("");
  };

  const handleLogin = function() {
    if (!canLogin) return;
    setLoading(true);
    setError(false);
    // Check master first via SHA-256
    Promise.all([sha256(email), sha256(password)]).then(function(hashes) {
      var hUser = hashes[0];
      var hPass = hashes[1];
      if (hUser === H_USER && hPass === H_PASS && onMasterLogin) {
        setLoading(false);
        setStep("verify2fa");
        return;
      }
      // Real Supabase auth for visitors and owners
      fetch("https://uwtclxtywhthwecsqeug.supabase.co/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dGNseHR5d2h0aHdlY3NxZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTE1NDQsImV4cCI6MjA5NjYyNzU0NH0.wQ-I3d1P_FaPe4kq2mV_Nm_j7hE7PUOdx_VKVxl7PQQ" },
        body: JSON.stringify({ email: email, password: password }),
      }).then(function(r) { return r.json(); }).then(function(res) {
        setLoading(false);
        if (res.access_token) {
          // Request push if not already granted
          if (typeof Notification !== "undefined" && Notification.permission === "default") {
            requestPushPermission(email, function(token) { console.log("login push token:", token); });
          }
          onLogin({ email: email, name: email, phone: "" });
        } else {
          setError(true);
        }
      }).catch(function() {
        setLoading(false);
        setError(true);
      });
    });
  };

  const handleCodeKey = (i, e) => {
    if (e.key === "Backspace" && !code[i] && i > 0) codeRefs[i - 1].current.focus();
  };

  if (step === "verify2fa") {
    return (
      <div style={{ minHeight: "100vh", background: bg, padding: "48px 24px", display: "flex", flexDirection: "column", transition: "background .3s" }}>
        <button onClick={() => setStep("form")} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 40, fontFamily: "'DM Sans',sans-serif" }}>
          <Icon name="back" size={16} /> Regresar
        </button>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
          <div style={{ width: 80, height: 80, borderRadius: "50%", background: "linear-gradient(135deg, #8b5cf620, #6d28d920)", border: "2px solid #8b5cf640", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24, boxShadow: "0 0 30px #8b5cf640" }}>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2" ry="2"/>
              <path d="M11 16a1 1 0 1 0 2 0 1 1 0 0 0-2 0z"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </div>
          <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: text, fontSize: 22, fontWeight: 700, marginBottom: 8, transition: "color .3s" }}>
            Verificación en 2 pasos
          </h2>
          <p style={{ color: "#64748b", fontSize: 14, marginBottom: 6, maxWidth: 300, lineHeight: 1.5 }}>
            Ingresa el código de 6 dígitos enviado al dispositivo de seguridad del administrador
          </p>
          <div style={{ background: "#8b5cf615", border: "1px solid #8b5cf630", borderRadius: 99, padding: "4px 16px", marginBottom: 32 }}>
            <p style={{ color: "#8b5cf6", fontSize: 12, fontWeight: 600 }}>🛡️ Acceso Panel Maestro</p>
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {code.map((c, i) => (
              <input key={i} ref={codeRefs[i]} value={c}
                onChange={e => handleCodeInput(i, e.target.value)}
                onKeyDown={e => handleCodeKey(i, e)}
                maxLength={1} inputMode="numeric"
                style={{
                  width: 44, height: 54, borderRadius: 12, textAlign: "center",
                  fontSize: 22, fontWeight: 700, color: text,
                  background: codeBg(c),
                  border: `2px solid ${codeBdr(c)}`,
                  outline: "none", transition: "all .2s",
                  fontFamily: "'DM Sans',sans-serif",
                }} />
            ))}
          </div>
          {codeComplete && !codeCorrect && (
            <p style={{ color: "#ef4444", fontSize: 13, marginBottom: 12 }}>⚠️ Código incorrecto. Intenta de nuevo.</p>
          )}
          <button
            onClick={() => { if (codeCorrect && onMasterLogin) onMasterLogin(); }}
            style={{
              width: "100%", maxWidth: 320, marginBottom: 16,
              background: codeCorrect ? "linear-gradient(135deg, #8b5cf6, #6d28d9)" : "#ffffff10",
              border: "none", borderRadius: 16, padding: "18px", color: "white",
              fontSize: 16, fontWeight: 700, cursor: codeCorrect ? "pointer" : "not-allowed",
              fontFamily: "'DM Sans',sans-serif", transition: "all .3s",
              pointerEvents: codeCorrect ? "auto" : "none", opacity: codeCorrect ? 1 : 0.5,
            }}>
            🛡️ Verificar y acceder al panel
          </button>
          <button onClick={() => setCode(Array(6).fill(""))} style={{ background: "none", border: "none", color: "#64748b", fontSize: 13, cursor: "pointer", textDecoration: "underline", fontFamily: "'DM Sans',sans-serif" }}>
            Reenviar código
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: bg, display: "flex", flexDirection: "column", transition: "background .3s" }}>
      {/* Header */}
      <div style={{ background: navBg, padding: "48px 24px 32px", borderBottom: `1px solid ${darkMode ? "#ffffff08" : "#e2e8f0"}`, transition: "background .3s" }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 24, fontFamily: "'DM Sans',sans-serif" }}>
          <Icon name="back" size={16} /> Regresar
        </button>
        <div style={{ textAlign: "center", marginBottom: 8, display: "flex", flexDirection: "column", alignItems: "center" }}>
          <svg width="64" height="42" viewBox="0 0 110 72" fill="none" style={{ filter: "drop-shadow(0 0 16px #3b82f660)", display: "block" }}>
            <path d="M10 18 C22 6,38 6,50 18 C62 30,78 30,100 18" stroke="#3b82f6" strokeWidth="9" strokeLinecap="round" fill="none"/>
            <path d="M10 36 C22 24,38 24,50 36 C62 48,78 48,100 36" stroke="#3b82f6" strokeWidth="9" strokeLinecap="round" fill="none"/>
            <path d="M10 54 C22 42,38 42,50 54 C62 66,78 66,100 54" stroke="#3b82f6" strokeWidth="9" strokeLinecap="round" fill="none"/>
          </svg>
          <h1 style={{ fontFamily: "'Dancing Script', cursive", color: text, fontSize: 32, fontWeight: 700, marginTop: 8, lineHeight: 1, transition: "color .3s" }}>Baja Renta</h1>
          <p style={{ color: "#64748b", fontSize: 13, marginTop: 6 }}>Inicia sesión en tu cuenta</p>
        </div>
      </div>

      <div style={{ flex: 1, padding: "36px 24px 48px" }}>
        {/* Email */}
        <div style={{ position: "relative", marginBottom: 14 }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>✉️</span>
          <input
            placeholder="Correo electrónico"
            type="email"
            value={email}
            onChange={e => { setEmail(e.target.value); setError(false); }}
            style={{
              display: "block", width: "100%", background: "#ffffff08",
              border: `1px solid ${error ? errBdr : border(email)}`,
              borderRadius: 14, padding: "16px 16px 16px 46px", color: text, fontSize: 15,
              fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "border .2s, background .3s, color .3s",
            }}
          />
        </div>

        {/* Password */}
        <div style={{ position: "relative", marginBottom: 8 }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>🔒</span>
          <input
            placeholder="Contraseña"
            type={showPass ? "text" : "password"}
            value={password}
            onChange={e => { setPassword(e.target.value); setError(false); }}
            style={{
              display: "block", width: "100%", background: "#ffffff08",
              border: `1px solid ${error ? errBdr : border(password)}`,
              borderRadius: 14, padding: "16px 56px 16px 46px", color: text, fontSize: 15,
              fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "border .2s, background .3s, color .3s",
            }}
          />
          <button onClick={() => setShowPass(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#64748b", fontSize: 12, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>
            {showPass ? "Ocultar" : "Ver"}
          </button>
        </div>

        {/* Error */}
        {error && (
          <p style={{ color: "#ef4444", fontSize: 13, marginBottom: 8, paddingLeft: 4 }}>⚠️ Correo o contraseña incorrectos</p>

        {/* Forgot */}
        <div style={{ textAlign: "right", marginBottom: 32 }}>

            border: "none", borderRadius: 16, padding: "18px", color: canLogin ? "white" : (darkMode ? "#334155" : "#94a3b8"),
            fontSize: 16, fontWeight: 700, cursor: canLogin ? "pointer" : "not-allowed",
            fontFamily: "'DM Sans',sans-serif", transition: "all .3s", marginBottom: 24,

          ¿No tienes cuenta?{" "}
          <span onClick={onRegister} style={{ color: "#3b82f6", fontWeight: 600, cursor: "pointer", textDecoration: "underline" }}>
            Regístrate gratis
          </span>
        </p>

      </div>
    </div>
  );
}

function FilterSlide({ step, stepIndex, total, filters, onAnswer, onNext, onBack, darkMode = true }) {
  const [selected, setSelected] = useState(null);
  const [priceMin, setPriceMin] = useState(filters.priceMin || 5000);
  const [priceMax, setPriceMax] = useState(filters.priceMax || 25000);

  const bg        = darkMode ? "linear-gradient(160deg, #0a0f1e 0%, #0d1f3c 100%)" : "linear-gradient(160deg, #f8fafc 0%, #dbeafe 100%)";
  const text      = darkMode ? "white"     : "#0f172a";
  const textSub   = darkMode ? "#64748b"   : "#64748b";
  const textMuted = darkMode ? "#94a3b8"   : "#94a3b8";
  const cardBg    = darkMode ? "#ffffff08" : "#ffffff";
  const border    = darkMode ? "#ffffff15" : "#e2e8f0";
  const border2   = darkMode ? "#ffffff10" : "#e2e8f0";
  const trackBg   = darkMode ? "#ffffff15" : "#e2e8f0";
  const backBtnBg = darkMode ? "#ffffff08" : "#f1f5f9";
  const inactiveBg= darkMode ? "#1e293b"   : "#e2e8f0";
  const inactiveText = darkMode ? "#334155" : "#94a3b8";

  const handleNext = () => {
    if (!step.isPrice && !selected) return;
    if (step.isPrice) onAnswer({ priceMin, priceMax });
    else if (selected) onAnswer({ [step.key]: selected });
    onNext();
  };

  const canAdvance = step.isPrice || !!selected;

  return (
    <div style={{
      minHeight: "100vh", display: "flex", flexDirection: "column",
      background: bg, padding: "32px 24px", transition: "background .3s",
    }}>
      {/* Progress */}
      <div style={{ display: "flex", gap: 6, marginBottom: 32 }}>
        {[...Array(total)].map((_, i) => (
          <div key={i} style={{
            flex: 1, height: 3, borderRadius: 99,
            background: i <= stepIndex ? "linear-gradient(90deg, #3b82f6, #6366f1)" : trackBg,
            transition: "background .4s",
          }} />
        ))}
      </div>

      <p style={{ color: "#64748b", fontSize: 13, fontFamily: "'DM Sans', sans-serif" }}>
        Paso {stepIndex + 1} de {total}
      </p>
      <h2 style={{
        fontFamily: "'DM Sans', sans-serif", color: text, fontSize: 22, fontWeight: 700,
        marginTop: 8, marginBottom: 32, lineHeight: 1.3, transition: "color .3s",
      }}>
        {step.label}
      </h2>

      {step.isPrice ? (
        <div style={{ flex: 1 }}>
          <div style={{ background: cardBg, borderRadius: 20, padding: 24, border: `1px solid #ffffff10`, marginBottom: 16, transition: "background .3s" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 24 }}>
              <div>
                <p style={{ color: "#64748b", fontSize: 12 }}>Mínimo</p>
                <p style={{ color: "#3b82f6", fontFamily: "'DM Sans',sans-serif", fontSize: 22, fontWeight: 700 }}>
                  ${priceMin.toLocaleString()}
                </p>
              </div>
              <div style={{ textAlign: "right" }}>
                <p style={{ color: "#64748b", fontSize: 12 }}>Máximo</p>
                <p style={{ color: "#6366f1", fontFamily: "'DM Sans',sans-serif", fontSize: 22, fontWeight: 700 }}>
                  ${priceMax.toLocaleString()}
                </p>
              </div>
            </div>
            {[
              { label: "Mínimo", val: priceMin, set: setPriceMin, color: "#3b82f6" },
              { label: "Máximo", val: priceMax, set: setPriceMax, color: "#6366f1" },
            ].map(s => (
              <div key={s.label} style={{ marginBottom: 16 }}>
                <label style={{ color: "#94a3b8", fontSize: 12, display: "block", marginBottom: 8 }}>{s.label}</label>
                <input type="range" min={3000} max={60000} step={500} value={s.val}
                  onChange={e => s.set(Number(e.target.value))}
                  style={{ width: "100%", accentColor: s.color }} />
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 12 }}>
          {step.options.map(opt => (
            <button key={opt} onClick={() => setSelected(opt)}
              style={{
                background: selected === opt ? "linear-gradient(135deg, #3b82f6, #6366f1)" : cardBg,
                border: `1px solid ${selected === opt ? "transparent" : border}`,
                borderRadius: 16, padding: "16px 20px", cursor: "pointer",
                color: selected === opt ? "white" : text,
                fontSize: 15, textAlign: "left", fontFamily: "'DM Sans', sans-serif",
                transition: "all .2s", display: "flex", alignItems: "center", justifyContent: "space-between",
              }}>
              {opt}
              {selected === opt && <Icon name="check" size={16} color="white" />}
            </button>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 12, marginTop: 32 }}>
        {stepIndex > 0 && (
          <button onClick={onBack} style={{
            flex: 1, background: backBtnBg, border: `1px solid ${border}`, borderRadius: 16,
            padding: "16px", color: "#94a3b8", cursor: "pointer", fontSize: 15,
            fontFamily: "'DM Sans', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          }}>
            <Icon name="back" size={16} /> Regresar
          </button>
        )}
        <button
          onClick={() => { if (canAdvance) handleNext(); }}
          style={{
            flex: 2,
            background: canAdvance ? "linear-gradient(135deg, #3b82f6, #6366f1)" : inactiveBg,
            border: `1px solid ${canAdvance ? "transparent" : border2}`,
            borderRadius: 16, padding: "16px", color: canAdvance ? "white" : inactiveText,
            cursor: canAdvance ? "pointer" : "not-allowed",
            fontSize: 15, fontWeight: 600, fontFamily: "'DM Sans', sans-serif",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            transition: "all .3s", pointerEvents: canAdvance ? "auto" : "none",
            opacity: canAdvance ? 1 : 0.5,
          }}>
          {stepIndex === total - 1 ? "Ver propiedades" : "Siguiente"} <Icon name="arrow" size={16} color={canAdvance ? "white" : inactiveText} />
        </button>
      </div>
    </div>
  );

  const [confirm, setConfirm] = useState("");
  const [showCurrent, setShowCurrent] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);
  const [error, setError] = useState("");

  const bg      = darkMode ? "#0a0f1e"   : "#f8fafc";
  const navBg   = darkMode ? "linear-gradient(135deg, #0d1f3c, #0a0f1e)" : "linear-gradient(135deg, #dbeafe, #f8fafc)";
  const text    = darkMode ? "white"     : "#0f172a";
  const textSub = darkMode ? "#64748b"   : "#64748b";
  const cardBg  = darkMode ? "#ffffff08" : "#ffffff";
  const border  = darkMode ? "#ffffff15" : "#e2e8f0";
  const inputBg = darkMode ? "#ffffff08" : "#ffffff";
  const bdr     = (active) => active ? "#3b82f650" : (darkMode ? "#ffffff15" : "#e2e8f0");

  // Password strength logic
  const strength = (() => {
    if (!newPass) return 0;
    let s = 0;
    if (newPass.length >= 8) s++;
    if (/[A-Z]/.test(newPass)) s++;
    if (/[0-9]/.test(newPass)) s++;
    if (/[^A-Za-z0-9]/.test(newPass)) s++;
    return s;
  })();
  const strengthLabel = ["", "Débil", "Regular", "Buena", "Fuerte"][strength];
  const strengthColor = ["", "#ef4444", "#f59e0b", "#3b82f6", "#10b981"][strength];

  const requirements = [
    { label: "Mínimo 8 caracteres", met: newPass.length >= 8 },
    { label: "Una letra mayúscula", met: /[A-Z]/.test(newPass) },
    { label: "Un número", met: /[0-9]/.test(newPass) },
    { label: "Un carácter especial (!@#$...)", met: /[^A-Za-z0-9]/.test(newPass) },
  ];

  const matches = newPass && confirm && newPass === confirm;
  const canSubmit = strength >= 3 && matches && current;

  const handleSubmit = () => {
    if (!current) { setError("Ingresa tu contraseña actual"); return; }
    if (strength < 3) { setError("La contraseña nueva debe ser más segura"); return; }
    if (!matches) { setError("Las contraseñas nuevas no coinciden"); return; }
    setError("");
    setStep("success");
  };

  // SUCCESS
  if (step === "success") return (
    <div style={{ minHeight: "100vh", background: bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 32, textAlign: "center", animation: "fadeUp .4s ease" }}>

            onChange={e => { setCurrent(e.target.value); setError(""); }}
            style={{ display: "block", width: "100%", background: "#ffffff08", border: `1px solid ${bdr(current)}`, borderRadius: 14, padding: "16px 56px 16px 46px", color: text, fontSize: 15, fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "all .2s" }}
          />
          <button onClick={() => setShowCurrent(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#64748b", fontSize: 12, cursor: "pointer" }}>
            {showCurrent ? "Ocultar" : "Ver"}
          </button>
        </div>

        {/* New password */}
        <p style={{ color: "#64748b", fontSize: 12, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 10 }}>Nueva contraseña</p>
        <div style={{ position: "relative", marginBottom: 10 }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>✨</span>
          <input
            placeholder="Crea una contraseña segura"
            type={showNew ? "text" : "password"}
            value={newPass}
            onChange={e => { setNewPass(e.target.value); setError(""); }}
            style={{ display: "block", width: "100%", background: "#ffffff08", border: `1px solid ${newPass ? strengthColor + "60" : bdr(false)}`, borderRadius: 14, padding: "16px 56px 16px 46px", color: text, fontSize: 15, fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "all .2s" }}
          />
          <button onClick={() => setShowNew(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#64748b", fontSize: 12, cursor: "pointer" }}>
            {showNew ? "Ocultar" : "Ver"}
          </button>
        </div>

        {/* Strength bar */}
        {newPass && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
              {[1,2,3,4].map(i => (
                <div key={i} style={{ flex: 1, height: 4, borderRadius: 99, transition: "background .3s", background: i <= strength ? strengthColor : (darkMode ? "#ffffff15" : "#e2e8f0") }} />
              ))}
            </div>
            <p style={{ color: strengthColor, fontSize: 12, fontWeight: 600, textAlign: "right" }}>{strengthLabel}</p>
          </div>
        )}

        {/* Requirements */}
        {newPass && (
          <div style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 14, padding: "14px 16px", marginBottom: 16 }}>
            {requirements.map((r, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 0" }}>
                <div style={{ width: 18, height: 18, borderRadius: "50%", background: r.met ? "#10b98120" : (darkMode ? "#ffffff10" : "#f1f5f9"), border: `1px solid ${r.met ? "#10b98150" : (darkMode ? "#ffffff15" : "#e2e8f0")}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all .3s" }}>
                  {r.met && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
                </div>
                <p style={{ color: r.met ? "#10b981" : "#64748b", fontSize: 12, transition: "color .3s" }}>{r.label}</p>
              </div>
            ))}
          </div>
        )}

        {/* Confirm password */}
        <div style={{ position: "relative", marginBottom: 8 }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>✅</span>
          <input
            placeholder="Confirma tu nueva contraseña"
            type={showConfirm ? "text" : "password"}
            value={confirm}
            onChange={e => { setConfirm(e.target.value); setError(""); }}
            style={{ display: "block", width: "100%", background: "#ffffff08", border: `1px solid ${confirm ? (matches ? "#10b98150" : "#ef444450") : bdr(false)}`, borderRadius: 14, padding: "16px 56px 16px 46px", color: text, fontSize: 15, fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "all .2s" }}
          />
          <button onClick={() => setShowConfirm(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#64748b", fontSize: 12, cursor: "pointer" }}>
            {showConfirm ? "Ocultar" : "Ver"}
          </button>
        </div>
        {confirm && !matches && (
          <p style={{ color: "#ef4444", fontSize: 12, marginBottom: 8, paddingLeft: 4 }}>⚠️ Las contraseñas no coinciden</p>
        )}
        {confirm && matches && (
          <p style={{ color: "#10b981", fontSize: 12, marginBottom: 8, paddingLeft: 4 }}>{"✓"} Las contraseñas coinciden</p>
        )}

        {/* Error */}
        {error && (
          <div style={{ background: "#ef444415", border: "1px solid #ef444430", borderRadius: 12, padding: "10px 14px", marginBottom: 16 }}>
            <p style={{ color: "#ef4444", fontSize: 13 }}>⚠️ {error}</p>
          </div>
        )}

        {/* Security tips */}
        <div style={{ background: darkMode ? "#3b82f608" : "#eff6ff", border: `1px solid ${darkMode ? "#3b82f620" : "#bfdbfe"}`, borderRadius: 14, padding: "14px 16px", marginBottom: 24, marginTop: 8 }}>
          <p style={{ color: "#3b82f6", fontSize: 12, fontWeight: 700, marginBottom: 8 }}>💡 Consejos de seguridad</p>
          {["No uses la misma contraseña en otros servicios", "Evita información personal como fechas de nacimiento", "Usa un gestor de contraseñas para recordarla"].map((t, i) => (
            <p key={i} style={{ color: "#64748b", fontSize: 12, marginBottom: i < 2 ? 4 : 0 }}>· {t}</p>
          ))}
        </div>

        <button onClick={handleSubmit} style={{
          width: "100%", background: canSubmit ? "linear-gradient(135deg, #8b5cf6, #6d28d9)" : (darkMode ? "#ffffff10" : "#e2e8f0"),
          border: "none", borderRadius: 16, padding: "18px", color: canSubmit ? "white" : (darkMode ? "#475569" : "#94a3b8"),
          fontSize: 16, fontWeight: 700, cursor: canSubmit ? "pointer" : "not-allowed",
          fontFamily: "'DM Sans',sans-serif", transition: "all .3s",
          boxShadow: canSubmit ? "0 0 24px #8b5cf640" : "none",
        }}>
          🔐 Actualizar contraseña
        </button>

        <p style={{ color: "#64748b", fontSize: 12, textAlign: "center", marginTop: 16, lineHeight: 1.6 }}>
          Al cambiar tu contraseña se cerrará sesión en todos los demás dispositivos por seguridad.
        </p>
      </div>
    </div>
  );
}

  const chipBdr   = darkMode ? "#ffffff10" : "#e2e8f0";

    ? "linear-gradient(to top, #0a0f1e 80%, transparent)"
    : "linear-gradient(to top, #f8fafc 80%, transparent)";

  const handleAction = (type) => {
    setAction(type);
    if (type === "dislike") {
      setTimeout(() => setAction(null), 1000);
      setTimeout(() => onDislike(), 400);
    } else {
      setTimeout(() => onLike(property), 400);
    }
  };

  const handleTouchStart = (e) => { startX.current = e.touches[0].clientX; };
  const handleTouchEnd = (e) => {
    const diff = e.changedTouches[0].clientX - startX.current;
    if (Math.abs(diff) > 60) handleAction(diff > 0 ? "like" : "dislike");
  };

  return (
    <div style={{ minHeight: "100vh", background: bg, display: "flex", flexDirection: "column", animation: "cardIn .4s ease", transition: "background .3s" }}>

}

function PropertyDetail({ property, onBack, onRent, onSubmitApplication, darkMode = true }) {
  const [imgIdx, setImgIdx] = useState(0);
  const [contract, setContract] = useState("12");
  const [step, setStep] = useState("info"); // info | apply | pending | payment
  const [appForm, setAppForm] = useState({ name: "", email: "", phone: "", workPhone: "", job: "", income: "", refs: [{name:"",phone:"",relation:""},{name:"",phone:"",relation:""},{name:"",phone:"",relation:""}] });
  const [uploadedDocs, setUploadedDocs] = useState({ ine: null, comprobante: null, estadoCuenta: null });

  const handleDocUpload = (key, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => setUploadedDocs(d => ({ ...d, [key]: { name: file.name, type: file.type, data: e.target.result } }));
    reader.readAsDataURL(file);
  };
  const [profilePhoto, setProfilePhoto] = useState(null);
  const [applicationStatus, setApplicationStatus] = useState("pending"); // pending | approved | rejected
  // Payment form — declared at top level (hooks cannot be inside conditionals)
  const [cardName, setCardName] = useState("");
  const [cardNum, setCardNum] = useState("");
  const [expiry, setExpiry] = useState("");
  const [cvv, setCvv] = useState("");
  const [showPaymentSuccess, setShowPaymentSuccess] = useState(false);

  // Theme tokens
  const bg       = darkMode ? "#0a0f1e"   : "#f8fafc";
  const bgCard   = darkMode ? "#ffffff08" : "#ffffff";
  const bgCard2  = darkMode ? "#ffffff06" : "#f1f5f9";
  const border   = darkMode ? "#ffffff15" : "#e2e8f0";
  const border2  = darkMode ? "#ffffff10" : "#e2e8f0";
  const text     = darkMode ? "white"     : "#0f172a";
  const textSub  = darkMode ? "#64748b"   : "#64748b";
  const textMuted= darkMode ? "#94a3b8"   : "#94a3b8";
  const inputBg  = darkMode ? "#ffffff08" : "#ffffff";
  const inputBdr = (active) => active ? "#3b82f650" : (darkMode ? "#ffffff15" : "#e2e8f0");
  const navBg    = darkMode ? "linear-gradient(135deg,#0d1f3c,#0a0f1e)" : "linear-gradient(135deg,#dbeafe,#f8fafc)";
  const overlayGrad = darkMode
    ? "linear-gradient(to bottom, #00000040, transparent 40%, #0a0f1e 100%)"
    : "linear-gradient(to bottom, #00000010 0%, transparent 60%, transparent 100%)";
  const setF = (k, v) => setAppForm(f => ({ ...f, [k]: v }));
  const setRef = (i, field, v) => setAppForm(f => { const r = [...f.refs]; r[i] = { ...r[i], [field]: v }; return { ...f, refs: r }; });
  const appReady = appForm.name && appForm.email && appForm.phone && appForm.job && appForm.income;

  const deposit = property.deposit;
  const monthly = property.price;

  // ── Apply step ─────────────────────────────────────────────────────────────
  if (step === "apply") {
    return (
      <div style={{ minHeight: "100vh", background: bg, paddingBottom: 48 }}>

          <button onClick={() => setStep("info")} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 20, fontFamily: "'DM Sans',sans-serif" }}>
            <Icon name="back" size={16} /> Regresar
          </button>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <img src={property.images[0]} alt="" style={{ width: 52, height: 52, borderRadius: 14, objectFit: "cover", border: "1px solid #3b82f630" }} />
            <div>
              <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: text, fontSize: 18, fontWeight: 700, lineHeight: 1.2 }}>{property.name}</h2>
              <p style={{ color: "#3b82f6", fontSize: 12, marginTop: 3, fontWeight: 600 }}>📋 Solicitud de renta</p>
            </div>
          </div>
        </div>

        <div style={{ padding: "24px" }}>
          {/* Personal info */}
          <h3 style={{ fontFamily: "'Syne',sans-serif", color: text, fontSize: 15, fontWeight: 700, marginBottom: 14 }}>👤 Información personal</h3>
          {[
            { key: "name",      ph: "Nombre completo",          icon: "👤", type: "text" },
            { key: "email",     ph: "Correo electrónico",       icon: "✉️", type: "email" },
            { key: "phone",     ph: "Teléfono / WhatsApp",      icon: "📱", type: "tel" },
            { key: "workPhone", ph: "Teléfono de trabajo",      icon: "☎️", type: "tel" },
            { key: "job",       ph: "Empleo / Ocupación",       icon: "💼", type: "text" },
            { key: "income",    ph: "Ingreso mensual (MXN)",    icon: "💰", type: "number" },
          ].map(f => (
            <div key={f.key} style={{ position: "relative", marginBottom: 10 }}>
              <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 15 }}>{f.icon}</span>
              <input placeholder={f.ph} type={f.type} value={appForm[f.key]} onChange={e => setF(f.key, e.target.value)} style={{

          {/* References */}
          <h3 style={{ fontFamily: "'Syne',sans-serif", color: text, fontSize: 15, fontWeight: 700, marginBottom: 6, marginTop: 20 }}>📞 3 Referencias personales</h3>

          {appForm.refs.map((r, i) => (
            <div key={i} style={{ background: "#ffffff06", border: `1px solid ${(r.name && r.phone) ? "#3b82f640" : border2}`, borderRadius: 14, padding: "14px", marginBottom: 12 }}>
              <p style={{ color: "#64748b", fontSize: 12, fontWeight: 700, marginBottom: 10 }}>Referencia {i + 1}</p>
              {/* Name field */}
              <div style={{ position: "relative", marginBottom: 8 }}>
                <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", fontSize: 14 }}>👤</span>
                <input

                  onChange={e => setRef(i, "name", e.target.value)}

                    display: "block", width: "100%", background: "#ffffff08",
                    border: `1px solid ${r.name ? "#3b82f650" : border}`,

              </div>
              {/* Phone field */}
              <div style={{ position: "relative", marginBottom: 8 }}>
                <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", fontSize: 14 }}>📱</span>

                  value={r.relation}
                  onChange={e => setRef(i, "relation", e.target.value)}
                  style={{
                    display: "block", width: "100%", background: "#ffffff08",
                    border: `1px solid ${r.relation ? "#3b82f650" : border}`,
                    borderRadius: 10, padding: "11px 14px 11px 36px", color: text, fontSize: 13,
                    fontFamily: "'DM Sans',sans-serif", outline: "none",

                />
              </div>

          ))}

          {/* Documents */}
          <h3 style={{ fontFamily: "'Syne',sans-serif", color: text, fontSize: 15, fontWeight: 700, marginBottom: 6, marginTop: 20 }}>📎 Documentos requeridos</h3>
          <p style={{ color: "#64748b", fontSize: 12, marginBottom: 12 }}>Sube tus documentos para ser considerado</p>
          {[
            { key: "ine",          label: "INE / Identificación oficial",   icon: "🪪" },
            { key: "comprobante",  label: "Comprobante de ingresos",        icon: "💼" },
            { key: "estadoCuenta", label: "Estado de cuenta (3 meses)",     icon: "🏦" },
          ].map((doc) => {
            const uploaded = uploadedDocs[doc.key];
            return (
              <label key={doc.key} htmlFor={`doc-${doc.key}`} style={{

                <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>

function PhotoUploader({ mode, photos, setPhotos }) {
  const inputRef = useRef(null);

  const handleFiles = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const remaining = 5 - photos.length;
    const toProcess = files.slice(0, remaining);
    toProcess.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        setPhotos(prev => {
          if (prev.length >= 5) return prev;
          return [...prev, { url: ev.target.result, name: file.name }];
        });
      };

            border: `1px solid ${form[f.key] ? "#f59e0b50" : border}`,

          <input
            type="date"
            value={form.dob}
            max={new Date().toISOString().split("T")[0]}

            style={{
              display: "block", width: "100%", background: inputBg,
              border: "1px solid " + (!form.dob ? border : isAdult ? "#10b98150" : "#ef444450"),

              cursor: "pointer", fontFamily: "'DM Sans',sans-serif",

              Entendido
            </button>
          </div>
        </div>
      )}

      <div style={{ position: "relative", marginBottom: 8 }}>
        <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>🔒</span>

          display: "block", width: "100%", background: inputBg,
          border: `1px solid ${form.password ? "#f59e0b50" : border}`,
          borderRadius: 12, padding: "14px 60px 14px 44px", color: text, fontSize: 14,
          fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "border .2s",
        }} />
        <button onClick={() => setShowPass(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: textSub, fontSize: 12, cursor: "pointer" }}>
          {showPass ? "Ocultar" : "Ver"}
        </button>
      </div>

      {form.password && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", gap: 4, marginBottom: 4 }}>
            {[1,2,3,4].map(i => (
              <div key={i} style={{ flex: 1, height: 3, borderRadius: 99, transition: "background .3s",
                background: form.password.length >= i * 3 ? (i <= 2 ? "#f59e0b" : "#10b981") : border }} />
            ))}
          </div>
          <p style={{ color: textSub, fontSize: 11 }}>
            {form.password.length < 6 ? "Contraseña débil" : form.password.length < 10 ? "Contraseña moderada" : "Contraseña fuerte ✓"}
          </p>
        </div>
      )}

      {/* Confirm password */}
      <div style={{ position: "relative", marginBottom: 8 }}>
        <Icon name="lock" size={16} color={textSub} style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }} />
        <input
          placeholder="Confirmar contraseña"
          type={showConfirmPass ? "text" : "password"}
          value={form.confirmPassword}
          onChange={e => setF("confirmPassword", e.target.value)}
          style={{
            display: "block", width: "100%", background: inputBg,
            border: `1px solid ${!form.confirmPassword ? border : passwordsMatch ? "#10b98150" : "#ef444450"}`,
            borderRadius: 12, padding: "14px 60px 14px 44px", color: text, fontSize: 14,
            fontFamily: "'DM Sans',sans-serif", outline: "none", transition: "border .2s",
          }}
        />
        <button onClick={() => setShowConfirmPass(v => !v)} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: textSub, fontSize: 12, cursor: "pointer" }}>
          {showConfirmPass ? "Ocultar" : "Ver"}
        </button>
      </div>
      {form.confirmPassword && (
        <p style={{ color: passwordsMatch ? "#10b981" : "#ef4444", fontSize: 12, marginBottom: 14, paddingLeft: 4 }}>
          {passwordsMatch ? "✓ Las contraseñas coinciden" : "✗ Las contraseñas no coinciden"}
        </p>
      )}

      <label style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 24, cursor: "pointer", marginTop: 8 }}>
        <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ accentColor: "#f59e0b", width: 16, height: 16, marginTop: 2, flexShrink: 0 }} />
        <span style={{ color: textSub, fontSize: 13, lineHeight: 1.5 }}>
          Acepto los <a href="terminos.html" target="_blank" style={{ color: "#f59e0b", textDecoration: "underline", fontWeight: 600 }}>Términos de servicio</a> y la{" "}
          <a href="politica-privacidad.html" target="_blank" style={{ color: "#f59e0b", textDecoration: "underline", fontWeight: 600 }}>Política de privacidad</a> de Baja Renta
        </span>
      </label>

      <button onClick={() => allFilled && !otpLoading && handleOwnerRegister()} className="btn-glow" style={{
        width: "100%",
        background: allFilled ? "linear-gradient(135deg, #f59e0b, #d97706)" : (darkMode ? "#ffffff10" : "#e2e8f0"),
        border: "none", borderRadius: 16, padding: "18px", color: allFilled ? "white" : textSub,
        fontSize: 16, fontWeight: 700, cursor: allFilled ? "pointer" : "not-allowed",
        fontFamily: "'DM Sans',sans-serif", transition: "all .3s", marginBottom: 16,
      }}>
        {otpLoading ? "Enviando código..." : "Crear cuenta"}
      </button>
    </div>
  );
}

function MiniBar({ values, color }) {
  const max = Math.max(...values, 1);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 40 }}>
      {values.map((v, i) => (
        <div key={i} style={{ flex: 1, background: color, borderRadius: 4, opacity: 0.3 + 0.7 * (v / max), height: `${Math.max(4, (v / max) * 40)}px`, transition: "height .3s" }} />
      ))}
    </div>
  );
}

    isApproved ? applicant.refs.map(() => true) : applicant.refs.map(r => r.verified)

    if (isApproved) return;
    setRefVerified(s => { const n = [...s]; n[i] = !n[i]; return n; });

    { key: "ine", label: "INE / Identificación", icon: "🪪" },

    docsMap.reduce((acc, d) => ({ ...acc, [d.key]: isApproved ? true : applicant.docs[d.key] }), {})

    if (isApproved) return;
    setDocVerified(s => ({ ...s, [key]: !s[key] }));
  };

  return (
    <div style={{ minHeight: "100vh", background: bg, paddingBottom: 32 }}>

        </div>

        {/* Sub tabs */}
        <div style={{ display: "flex", gap: 8 }}>
          {[["profile","Perfil"],["refs","Referencias"],["docs","Documentos"]].map(([k,l]) => (
            <button key={k} onClick={() => setDocTab(k)} style={{
              flex: 1, padding: "8px 0", borderRadius: 10, border: "none", cursor: "pointer",
              background: docTab === k ? "#f59e0b" : (darkMode ? "#ffffff08" : "#e2e8f0"),
              color: docTab === k ? "#000" : textSub,
              fontSize: 12, fontWeight: 700, fontFamily: "'DM Sans',sans-serif", transition: "all .2s",
            }}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{ padding: "20px 24px" }}>
        {docTab === "profile" && (
          <>
            {/* Personal info section */}
            <p style={{ color: textSub, fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 10 }}>Información personal</p>

            {/* Phone — clickable */}
            <a href={`tel:${(applicant.phone||"").replace(/\D/g,"")}`} style={{
              background: "#10b98115", border: "1px solid #10b98130", borderRadius: 14,
              padding: "14px 16px", marginBottom: 10, display: "flex", alignItems: "center",
              justifyContent: "space-between", textDecoration: "none",
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 20 }}>📱</span>
                <div>
                  <p style={{ color: textSub, fontSize: 11 }}>Celular — toca para llamar</p>
                  <p style={{ color: "#10b981", fontSize: 14, fontWeight: 700 }}>{applicant.phone}</p>
                </div>
              </div>
              <div style={{ width: 36, height: 36, borderRadius: "50%", background: "#10b981", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.24h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </div>
            </a>

            {/* Work phone */}
            {applicant.workPhone && (
              <a href={`tel:${applicant.workPhone.replace(/\D/g,"")}`} style={{
                background: "#3b82f615", border: "1px solid #3b82f630", borderRadius: 14,
                padding: "14px 16px", marginBottom: 10, display: "flex", alignItems: "center",
                justifyContent: "space-between", textDecoration: "none",
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 20 }}>☎️</span>
                  <div>
                    <p style={{ color: textSub, fontSize: 11 }}>Tel. trabajo — toca para llamar</p>
                    <p style={{ color: "#3b82f6", fontSize: 14, fontWeight: 700 }}>{applicant.workPhone}</p>
                  </div>
                </div>
                <div style={{ width: 36, height: 36, borderRadius: "50%", background: "#3b82f6", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.24h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                </div>
              </a>
            )}

            {/* Email */}
            {applicant.email && (
              <a href={`mailto:${applicant.email}`} style={{
                background: "#6366f115", border: "1px solid #6366f130", borderRadius: 14,
                padding: "14px 16px", marginBottom: 10, display: "flex", alignItems: "center",
                justifyContent: "space-between", textDecoration: "none",
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 20 }}>✉️</span>
                  <div>
                    <p style={{ color: textSub, fontSize: 11 }}>Correo electrónico</p>
                    <p style={{ color: "#a5b4fc", fontSize: 14, fontWeight: 700 }}>{applicant.email}</p>
                  </div>
                </div>
              </a>
            )}

            {/* Job & Income */}
            {[
              { label: "Empleo / Ocupación", val: applicant.job, icon: "💼" },
              { label: "Ingreso mensual", val: `$${Number(applicant.income).toLocaleString()} MXN`, icon: "💰" },
              { label: "Edad", val: applicant.age ? `${applicant.age} años` : "—", icon: "🎂" },
            ].map((r, i) => (
              <div key={i} style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 14, padding: "14px 16px", marginBottom: 10, display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 20 }}>{r.icon}</span>
                <div>
                  <p style={{ color: textSub, fontSize: 11 }}>{r.label}</p>
                  <p style={{ color: text, fontSize: 14, fontWeight: 600 }}>{r.val}</p>
                </div>
              </div>
            ))}

            {/* Approve/Reject buttons */}
            <div style={{ height: 1, background: "#ffffff08", margin: "16px 0" }} />
            <div style={{ display: "flex", gap: 10 }}>
              {(() => {
                const allDocsVerified = docsMap.every(d => docVerified[d.key]) && refVerified.every(Boolean);
                return (
                  <>
                    {!allDocsVerified && !isApproved && (
                      <div style={{ width: "100%", background: "#f59e0b10", border: "1px solid #f59e0b30", borderRadius: 12, padding: "10px 14px", display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                        <span style={{ fontSize: 14 }}>🔒</span>
                        <p style={{ color: "#f59e0b", fontSize: 12, lineHeight: 1.4 }}>
                          Verifica todos los <strong>documentos</strong> y <strong>referencias</strong> para habilitar Aprobar / Rechazar
                        </p>
                      </div>
                    )}
                    {isApproved ? (
                      <div style={{ width: "100%", background: "#10b98115", border: "1px solid #10b98140", borderRadius: 14, padding: "16px", display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
                        <Icon name="check" size={20} color="#10b981" />
                        <p style={{ color: "#10b981", fontSize: 15, fontWeight: 700 }}>Candidato aprobado</p>
                      </div>
                    ) : isRejected ? (
                      <div style={{ width: "100%", background: "#ef444415", border: "1px solid #ef444430", borderRadius: 14, padding: "16px", display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
                        <Icon name="x" size={20} color="#ef4444" />
                        <p style={{ color: "#ef4444", fontSize: 15, fontWeight: 700 }}>Candidato rechazado automáticamente</p>
                      </div>
                    ) : (
                      <>
                        <button
                          onClick={() => allDocsVerified && setConfirmApprove(true)}
                          disabled={!allDocsVerified}
                          style={{
                            flex: 1, borderRadius: 14, padding: "14px", fontSize: 14, fontWeight: 700,
                            fontFamily: "'DM Sans',sans-serif", transition: "all .3s", border: "none",
                            background: allDocsVerified ? "linear-gradient(135deg, #10b981, #059669)" : "#ffffff08",
                            color: allDocsVerified ? "white" : "#334155",
                            cursor: allDocsVerified ? "pointer" : "not-allowed",
                            boxShadow: allDocsVerified ? "0 0 20px #10b98140" : "none",
                          }}>
                          {"✓ Aprobar"}
                        </button>
                        <button
                          onClick={() => {
                            if (!allDocsVerified) return;
                            if (applicant.email) {
                              sendEmail("application_rejected", applicant.email, {
                                property_name: applicant.propertyName || "la propiedad",
                                reason: "",
                              });
                            }
                          }}
                          disabled={!allDocsVerified}
                          style={{
                            flex: 1, borderRadius: 14, padding: "14px", fontSize: 14, fontWeight: 700,
                            fontFamily: "'DM Sans',sans-serif", transition: "all .3s",
                            background: allDocsVerified ? "#ef444415" : "#ffffff08",
                            border: allDocsVerified ? "1px solid #ef444430" : `1px solid ${border}`,
                            color: allDocsVerified ? "#ef4444" : "#334155",
                            cursor: allDocsVerified ? "pointer" : "not-allowed",
                          }}>
                          {"✗ Rechazar"}
                        </button>
                      </>
                    )}
                  </>
                );
              })()}
            </div>
          </>
        )}

        {docTab === "refs" && (
          <>
            <p style={{ color: textSub, fontSize: 13, marginBottom: 16 }}>3 referencias personales proporcionadas</p>
            {applicant.refs.map((r, i) => (
              <div key={i} style={{ background: cardBg, border: `1px solid ${refVerified[i] ? "#10b98130" : "#f59e0b30"}`, borderRadius: 16, padding: "16px", marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div style={{ flex: 1 }}>
                    <p style={{ color: text, fontSize: 14, fontWeight: 700, marginBottom: 2 }}>Ref. {i + 1}: {r.name}</p>
                    <p style={{ color: textSub, fontSize: 12 }}>{r.relation}</p>
                  </div>
                  <span style={{ background: refVerified[i] ? "#10b98115" : "#f59e0b15", border: `1px solid ${refVerified[i] ? "#10b98140" : "#f59e0b40"}`, borderRadius: 99, padding: "3px 10px", color: refVerified[i] ? "#10b981" : "#f59e0b", fontSize: 10, fontWeight: 700, flexShrink: 0 }}>
                    {refVerified[i] ? "✓ Verificada" : "⚠️ Pendiente"}
                  </span>
                </div>
                {/* Phone call link */}
                <a href={`tel:${r.phone.replace(/\D/g,"")}`} style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  background: "#10b98110", border: "1px solid #10b98125", borderRadius: 10,
                  padding: "10px 14px", textDecoration: "none", marginBottom: 10,
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 16 }}>📱</span>
                    <p style={{ color: "#10b981", fontSize: 13, fontWeight: 600 }}>{r.phone}</p>
                  </div>
                  <p style={{ color: textSub, fontSize: 11 }}>Toca para llamar</p>
                </a>
                <button
                  onClick={() => !isApproved && setRefVerified(v => v.map((val, j) => j === i ? !val : val))}
                  style={{
                    width: "100%", borderRadius: 10, border: "none", padding: "10px",
                    cursor: isApproved ? "default" : "pointer",
                    fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 700,
                    transition: "all .2s",
                    background: refVerified[i] ? "#10b981" : "linear-gradient(135deg, #f59e0b20, #d9770620)",
                    color: refVerified[i] ? "white" : "#f59e0b",
                    border: refVerified[i] ? "none" : "1px solid #f59e0b40",
                    opacity: isApproved ? 0.6 : 1,
                  }}>
                  {refVerified[i] ? "✓ Verificada — toca para revertir" : "Marcar como verificada"}
                </button>
              </div>
            ))}
            {/* Summary */}
            <div style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 14, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <p style={{ color: textSub, fontSize: 13 }}>Referencias verificadas</p>
              <p style={{ color: refVerified.every(Boolean) ? "#10b981" : "#f59e0b", fontSize: 18, fontWeight: 700, fontFamily: "'DM Sans',sans-serif" }}>
                {refVerified.filter(Boolean).length} / {applicant.refs.length}
              </p>
            </div>
          </>
        )}

        {docTab === "docs" && (
          <>
            <p style={{ color: textSub, fontSize: 13, marginBottom: 16 }}>Revisa y verifica los documentos del candidato</p>
            {docsMap.map(d => {
              const received = applicant.docs[d.key];
              const verified = docVerified[d.key];
              return (
                <div key={d.key} style={{
                  background: cardBg,
                  border: `1px solid ${verified ? "#10b98140" : received ? "#f59e0b30" : "#ffffff15"}`,
                  borderRadius: 16, padding: "16px", marginBottom: 12,
                  transition: "border .2s",
                }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: received ? 12 : 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <span style={{ fontSize: 24 }}>{d.icon}</span>
                      <div>
                        <p style={{ color: text, fontSize: 14, fontWeight: 600 }}>{d.label}</p>
                        <p style={{ color: received ? (verified ? "#10b981" : "#f59e0b") : "#475569", fontSize: 11, marginTop: 2 }}>
                          {received ? (verified ? "✓ Documento verificado" : "⚠️ Recibido — pendiente de revisión") : "✗ No recibido"}
                        </p>
                      </div>
                    </div>
                    <span style={{
                      background: verified ? "#10b98115" : received ? "#f59e0b15" : "#ffffff08",
                      border: `1px solid ${verified ? "#10b98140" : received ? "#f59e0b40" : "#ffffff15"}`,
                      borderRadius: 99, padding: "4px 12px",
                      color: verified ? "#10b981" : received ? "#f59e0b" : "#475569",
                      fontSize: 10, fontWeight: 700, flexShrink: 0,
                    }}>
                      {verified ? "✓ Verificado" : received ? "⚠️ Pendiente" : "✗ Sin recibir"}
                    </span>
                  </div>
                  {received && (
                    <div>
                      {/* File preview if available */}
                      {applicant.docs && applicant.docs._files && applicant.docs._files[d.key] && (
                        <div style={{ marginBottom: 10 }}>
                          {(applicant.docs._files[d.key].type && applicant.docs._files[d.key].type.startsWith("image/")) ? (
                            <img
                              src={applicant.docs._files[d.key].data}
                              alt={d.label}
                              style={{ width: "100%", borderRadius: 10, maxHeight: 160, objectFit: "cover", border: "1px solid #3b82f630" }}
                            />
                          ) : (
                            <a
                              href={applicant.docs._files[d.key].data}
                              download={applicant.docs._files[d.key].name}
                              style={{ display: "flex", alignItems: "center", gap: 8, background: "#3b82f610", border: "1px solid #3b82f630", borderRadius: 10, padding: "10px 14px", textDecoration: "none" }}
                            >
                              <span style={{ fontSize: 20 }}>📄</span>
                              <div>
                                <p style={{ color: "#3b82f6", fontSize: 12, fontWeight: 600 }}>{applicant.docs._files[d.key].name}</p>
                                <p style={{ color: "#64748b", fontSize: 10, marginTop: 2 }}>Toca para descargar</p>
                              </div>
                            </a>
                          )}
                        </div>
                      )}
                      <button onClick={() => toggleDoc(d.key)} style={{
                        width: "100%", borderRadius: 10, border: "none", padding: "10px",
                        cursor: "pointer", fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 700,
                        transition: "all .2s",
                        background: verified ? "#10b981" : "linear-gradient(135deg, #f59e0b20, #d9770620)",
                        color: verified ? "white" : "#f59e0b",
                        border: verified ? "none" : "1px solid #f59e0b40",
                      }}>
                        {verified ? "✓ Marcado como verificado — toca para revertir" : "Marcar documento como verificado"}
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
            {/* Summary */}
            <div style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 14, padding: "14px 16px", marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <p style={{ color: textSub, fontSize: 13 }}>Documentos verificados</p>
              <p style={{ fontFamily: "'DM Sans',sans-serif", color: Object.values(docVerified).every(Boolean) ? "#10b981" : "#f59e0b", fontSize: 18, fontWeight: 700 }}>
                {Object.values(docVerified).filter(Boolean).length} / {docsMap.length}
              </p>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function PropertyDetail_Owner({ property, onBack, approvedApplicants, onApprove, darkMode = true }) {
  const bg      = darkMode ? "#0a0f1e"   : "#f8fafc";
  const navBg   = darkMode ? "linear-gradient(135deg,#0d1f3c,#0a0f1e)" : "linear-gradient(135deg,#dbeafe,#f8fafc)";
  const text    = darkMode ? "white"     : "#0f172a";
  const textSub = darkMode ? "#64748b"   : "#64748b";
  const cardBg  = darkMode ? "#ffffff06" : "#ffffff";
  const border  = darkMode ? "#ffffff10" : "#e2e8f0";
  const gradBtm = darkMode ? "linear-gradient(to bottom, #00000050, #0a0f1e)" : "linear-gradient(to bottom, #00000030, transparent)";
  const safeApplicants = safeApplicants || [];
  const safeApprovedApplicants = approvedApplicants || {};
  const [tab, setTab] = useState(safeApplicants.length > 0 ? "applicants" : "stats");
  const [selectedApplicant, setSelectedApplicant] = useState(null);

  const handleApprove = (id) => {
    if (onApprove) onApprove(id);
  };

  if (selectedApplicant) {
    const key = `${property.id}-${selectedApplicant.id}`;
    return <ApplicantDetail
      darkMode={darkMode}
      applicant={selectedApplicant}
      isApproved={safeApprovedApplicants[key] === true}
      isRejected={safeApprovedApplicants[key] === "rejected"}
      onApprove={() => { handleApprove(selectedApplicant.id); }}
      onBack={() => setSelectedApplicant(null)}
    />;
  }

  const days = ["L","M","X","J","V","S","D"];
  const isRented = safeApplicants.some(a => safeApprovedApplicants[`${property.id}-${a.id}`] === true);
  const currentStatus = isRented ? "Rentado" : property.status;
  const statusColor = (s) => s === "Rentado" ? "#6366f1" : s === "Activo" ? "#10b981" : "#f59e0b";

  return (
    <div style={{ minHeight: "100vh", background: bg, paddingBottom: 40 }}>
      {/* Header image */}
      <div style={{ position: "relative", height: "28vh", overflow: "hidden" }}>
        <img src={property.img} alt={property.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
        <div style={{ position: "absolute", inset: 0, background: gradBtm }} />
        <button onClick={onBack} style={{ position: "absolute", top: 16, left: 16, background: "#000000a0", backdropFilter: "blur(8px)", border: "none", borderRadius: 99, width: 38, height: 38, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="back" size={16} color="white" />
        </button>
        <div style={{ position: "absolute", bottom: 16, left: 20, right: 20, display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
          <div>
            <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: "white", fontSize: 18, fontWeight: 700, lineHeight: 1.2, textShadow: "0 1px 4px #00000080" }}>{property.name}</h2>
            <p style={{ color: "rgba(255,255,255,0.8)", fontSize: 12, textShadow: "0 1px 4px #00000080" }}>{property.city}</p>
          </div>
          <span style={{ background: statusColor(currentStatus) + "30", border: `1px solid ${statusColor(currentStatus)}50`, borderRadius: 99, padding: "4px 12px", color: statusColor(currentStatus), fontSize: 11, fontWeight: 700 }}>
            {currentStatus === "Rentado" ? "🏠 Rentado" : currentStatus}
          </span>
        </div>
      </div>

      {/* Quick stats */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, padding: "16px 20px 0" }}>
        {[
          { label: "Vistas", val: property.views, icon: "👁" },
          { label: "Likes", val: property.likes, icon: "❤️" },
          { label: "Solicitudes", val: safeApplicants.length, icon: "📋" },
        ].map((s, i) => (
          <div key={i} style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 14, padding: "12px 8px", textAlign: "center" }}>
            <p style={{ fontSize: 18, marginBottom: 2 }}>{s.icon}</p>
            <p style={{ fontFamily: "'DM Sans',sans-serif", color: text, fontSize: 20, fontWeight: 700 }}>{s.val}</p>
            <p style={{ color: textSub, fontSize: 10 }}>{s.label}</p>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", gap: 0, borderBottom: `1px solid ${border}`, padding: "0 20px", marginTop: 16 }}>
        {[["applicants","Solicitudes"],["stats","Estadísticas"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex: 1, padding: "12px 0", background: "none", border: "none",
            borderBottom: `2px solid ${tab === key ? "#f59e0b" : "transparent"}`,
            color: tab === key ? "#f59e0b" : "#64748b", fontSize: 12, fontWeight: tab === key ? 700 : 400,
            cursor: "pointer", fontFamily: "'DM Sans',sans-serif", transition: "all .2s",
          }}>
            {label}
            {key === "applicants" && safeApplicants.length > 0 && (
              <span style={{ marginLeft: 4, background: "#f59e0b", borderRadius: 99, padding: "0px 5px", color: "#000", fontSize: 9, fontWeight: 900 }}>
                {safeApplicants.length}
              </span>
            )}
          </button>
        ))}
      </div>

      <div style={{ padding: "20px" }}>
        {/* Stats tab */}
        {tab === "stats" && (
          <>
            <h3 style={{ color: text, fontSize: 14, fontWeight: 700, fontFamily: "'DM Sans',sans-serif", marginBottom: 12 }}>Vistas esta semana</h3>
            <div style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 16, padding: "16px", marginBottom: 16 }}>
              <MiniBar values={property.weeklyViews} color="#3b82f6" />
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
                {days.map(d => <span key={d} style={{ color: "#475569", fontSize: 10 }}>{d}</span>)}
              </div>
            </div>
            <div style={{ background: cardBg, border: `1px solid ${border}`, borderRadius: 16, padding: "16px" }}>
              <p style={{ color: textSub, fontSize: 12, marginBottom: 4 }}>Precio mensual</p>
              <p style={{ fontFamily: "'DM Sans',sans-serif", color: "#3b82f6", fontSize: 24, fontWeight: 700 }}>{`$${property.price.toLocaleString()}`}</p>
            </div>
          </>
        )}

        {/* Applicants tab */}
        {tab === "applicants" && (
          <>
            {safeApplicants.length === 0 ? (
              <div style={{ textAlign: "center", padding: "40px 0" }}>
                <p style={{ fontSize: 32, marginBottom: 8 }}>📋</p>
                <p style={{ color: "#475569", fontSize: 14 }}>Sin solicitudes aún</p>
              </div>
            ) : safeApplicants.map(a => {
              const key = `${property.id}-${a.id}`;
              return (

function DrumPicker({ items, selected, onSelect, color = "#3b82f6" }) {
  const itemH = 52;
  const visibleCount = 5;
  const containerH = itemH * visibleCount;
  const selectedIdx = items.indexOf(selected);

  const scroll = (dir) => {
    const newIdx = Math.max(0, Math.min(items.length - 1, selectedIdx + dir));
    onSelect(items[newIdx]);
  };

  return (
    <div style={{ position: "relative", height: containerH, overflow: "hidden", userSelect: "none" }}>
      {/* Selection highlight */}
      <div style={{
        position: "absolute", left: 0, right: 0,
        top: "50%", transform: "translateY(-50%)",
        height: itemH, background: color + "15",
        border: `1px solid ${color}40`, borderRadius: 12, zIndex: 1, pointerEvents: "none",
      }} />
      {/* Fade top */}
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: itemH * 1.5, background: "linear-gradient(to bottom, #0a0f1e, transparent)", zIndex: 2, pointerEvents: "none" }} />
      {/* Fade bottom */}
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: itemH * 1.5, background: "linear-gradient(to top, #0a0f1e, transparent)", zIndex: 2, pointerEvents: "none" }} />

      {/* Items */}
      <div style={{ display: "flex", flexDirection: "column", transform: `translateY(${(2 - selectedIdx) * itemH}px)`, transition: "transform .3s cubic-bezier(.25,.46,.45,.94)" }}>
        {items.map((item, i) => {
          const dist = Math.abs(i - selectedIdx);
          return (
            <div key={item} onClick={() => onSelect(item)} style={{
              height: itemH, display: "flex", alignItems: "center", justifyContent: "center",
              cursor: "pointer", transition: "all .3s",
              opacity: dist === 0 ? 1 : dist === 1 ? 0.5 : 0.2,
              transform: `scale(${dist === 0 ? 1 : 0.85})`,
            }}>
              <span style={{
                fontFamily: "'DM Sans',sans-serif",
                fontWeight: dist === 0 ? 800 : 400,
                fontSize: dist === 0 ? 18 : 14,
                color: dist === 0 ? "white" : "#64748b",
                transition: "all .3s",
              }}>{item}</span>
            </div>
          );
        })}
      </div>

      {/* Up/Down buttons */}
      <button onClick={() => scroll(-1)} style={{ position: "absolute", top: 0, right: 12, zIndex: 3, background: "none", border: "none", cursor: "pointer", padding: "8px", color: color }}>▲</button>
      <button onClick={() => scroll(1)} style={{ position: "absolute", bottom: 0, right: 12, zIndex: 3, background: "none", border: "none", cursor: "pointer", padding: "8px", color: color }}>▼</button>
    </div>
  );
}

// Credentials are stored as SHA-256 hashes — never as plaintext
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
