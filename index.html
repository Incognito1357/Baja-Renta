              { label: "🧺 Cuarto lavado", val: p.laundry },
              { label: "🌿 Patio/jardín", val: p.patio },
              { label: "🏊 Alberca", val: p.pool },
              { label: "🐾 Pet Friendly", val: p.petFriendly },
              { label: "👶 Niños OK", val: p.kidsAllowed },
            ].map((f, i) => (
              <span key={i} style={{ background: f.val ? "#10b98115" : "#ffffff06", border: `1px solid ${f.val ? "#10b98130" : "#ffffff15"}`, borderRadius: 99, padding: "4px 12px", color: f.val ? "#10b981" : "#475569", fontSize: 12 }}>
                {f.val ? "✓" : "✗"} {f.label}
              </span>
            ))}
          </div>

          {/* Photos */}
          {p._uploadedPhotos && p._uploadedPhotos.length > 0 && (
            <>
              <p style={{ color: "#64748b", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>{"Fotos subidas por el propietario ("}{p._uploadedPhotos.length}{")"}</p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginBottom: 16 }}>
                {p._uploadedPhotos.map((photo, i) => (
                  <div key={i} style={{ aspectRatio: "1", borderRadius: 12, overflow: "hidden", border: `1px solid #ffffff15`, position: "relative" }}>
                    <img src={photo.url} alt={photo.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                    {i === 0 && (
                      <div style={{ position: "absolute", top: 4, left: 4, background: "#f59e0b", borderRadius: 99, padding: "2px 7px", fontSize: 9, fontWeight: 700, color: "white" }}>Principal</div>
                    )}
                  </div>
                ))}
              </div>
            </>
          )}

          {p._uploadedPhotos && p._uploadedPhotos.length === 0 && (
            <div style={{ background: "#f59e0b10", border: "1px solid #f59e0b30", borderRadius: 12, padding: "10px 14px", marginBottom: 16 }}>
              <p style={{ color: "#f59e0b", fontSize: 12 }}>⚠️ El propietario no subió fotos — se usarán imágenes de referencia</p>
            </div>
          )}

          {/* Legal Documents */}
          {p._uploadedDocs && (
            <>
              <p style={{ color: "#64748b", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>Documentos legales</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
                {[
                  { key: "escritura", label: "Escritura / Título de propiedad", icon: "🏠" },
                  { key: "ine", label: "Identificación oficial (INE)", icon: "🪪" },
                  { key: "domicilio", label: "Comprobante de domicilio", icon: "📄" },
                  { key: "predial", label: "Predial al corriente", icon: "📋" },
                ].map(doc => {
                  const uploaded = p._uploadedDocs && p._uploadedDocs[doc.key];
                  const isPdf = uploaded && uploaded.type === "application/pdf";
                  const isImg = uploaded && uploaded.type && uploaded.type.startsWith("image/");
                  return (
                    <div key={doc.key} style={{ background: uploaded ? "#10b98112" : "#ffffff06", border: `1px solid ${uploaded ? "#10b98130" : "#ffffff15"}`, borderRadius: 14, padding: "12px 14px" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: uploaded && isImg ? 10 : 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ fontSize: 18 }}>{doc.icon}</span>
                          <div>
                            <p style={{ color: uploaded ? "#10b981" : "#64748b", fontSize: 12, fontWeight: uploaded ? 600 : 400 }}>{doc.label}</p>
                            {uploaded && <p style={{ color: "#64748b", fontSize: 11, marginTop: 1 }}>📎 {uploaded.name}</p>}
                          </div>
                        </div>
                        <span style={{ background: uploaded ? "#10b98120" : "#ffffff10", border: `1px solid ${uploaded ? "#10b98140" : "#ffffff15"}`, borderRadius: 99, padding: "3px 10px", color: uploaded ? "#10b981" : "#475569", fontSize: 10, fontWeight: 700 }}>
                          {uploaded ? "✓ Recibido" : "✗ No subido"}
                        </span>
                      </div>
                      {uploaded && isImg && (
                        <img src={uploaded.data} alt={uploaded.name} style={{ width: "100%", maxHeight: 180, objectFit: "contain", borderRadius: 8, background: "#000000a0" }} />
                      )}
                      {uploaded && isPdf && (
                        <a href={uploaded.data} download={uploaded.name} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#3b82f615", border: "1px solid #3b82f630", borderRadius: 8, padding: "6px 12px", color: "#3b82f6", fontSize: 12, fontWeight: 600, textDecoration: "none", marginTop: 8 }}>
                          📥 Descargar PDF
                        </a>
                      )}
                    </div>
                  );
                })}
              </div>
              {p._uploadedDocs && !Object.values(p._uploadedDocs).some(Boolean) && (
                <div style={{ background: "#ef444410", border: "1px solid #ef444430", borderRadius: 12, padding: "10px 14px", marginBottom: 16 }}>
                  <p style={{ color: "#ef4444", fontSize: 12 }}>⚠️ El propietario no subió documentos legales todavía</p>
                </div>
              )}
            </>
          )}

          {/* Approve / Reject */}
          <div style={{ height: 1, background: "#ffffff06", marginBottom: 16 }} />
          {p.status === "aprobada" ? (
            <div>
              <div style={{ background: "#10b98115", border: "1px solid #10b98130", borderRadius: 14, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <Icon name="check" size={18} color="#10b981" />
                <p style={{ color: "#10b981", fontSize: 14, fontWeight: 700 }}>Propiedad aprobada y publicada</p>
              </div>
              <button onClick={() => { toggleStatus(p.id); setSelected(null); }} style={{
                width: "100%", background: "#f59e0b15", border: "1px solid #f59e0b40",
                borderRadius: 14, padding: "14px", color: "#f59e0b",
                fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
              }}>
                ↩ Revocar aprobación
              </button>
            </div>
          ) : p.status === "rechazada" ? (
            <div>
              <div style={{ background: "#ef444415", border: "1px solid #ef444430", borderRadius: 14, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <Icon name="x" size={18} color="#ef4444" />
                <p style={{ color: "#ef4444", fontSize: 14, fontWeight: 700 }}>Propiedad rechazada</p>
              </div>
              <button onClick={() => { toggleStatus(p.id); setSelected(null); }} style={{
                width: "100%", background: "linear-gradient(135deg, #10b981, #059669)",
                border: "none", borderRadius: 14, padding: "14px", color: "white",
                fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
              }}>
                {"✓ Aprobar propiedad"}
              </button>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 12 }}>
              <button onClick={() => { toggleStatus(p.id); setSelected(null); }} style={{
                flex: 1, background: "linear-gradient(135deg, #10b981, #059669)",
                border: "none", borderRadius: 16, padding: "18px", color: "white",
                fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
                boxShadow: "0 0 20px #10b98140",
              }}>
                {"✓ Aprobar"}
              </button>
              <button onClick={() => { rejectStatus(p.id); setSelected(null); }} style={{
                flex: 1, background: "#ef444415", border: "1px solid #ef444430",
                borderRadius: 16, padding: "18px", color: "#ef4444",
                fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
              }}>
                {"✗ Rechazar"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0a0f1e", paddingBottom: 48 }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #1e0a3c, #0a0f1e)", padding: "48px 24px 24px", borderBottom: "1px solid #8b5cf620" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 44, height: 44, borderRadius: 14, background: "linear-gradient(135deg, #8b5cf6, #6d28d9)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
              </svg>
            </div>
            <div>
              <h1 style={{ fontFamily: "'Syne',sans-serif", color: "white", fontSize: 18, fontWeight: 800, lineHeight: 1 }}>Panel Maestro</h1>
              <p style={{ color: "#8b5cf6", fontSize: 11, marginTop: 2, fontWeight: 600 }}>Administrador Baja Renta</p>
            </div>
          </div>
          <button onClick={onBack} style={{ background: "#ffffff06", border: `1px solid #ffffff15`, borderRadius: 99, padding: "8px 14px", color: "#64748b", fontSize: 12, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>
            Salir
          </button>
        </div>
        {/* Stats */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
          {[
            { label: "Total", val: properties.length, color: "#8b5cf6" },
            { label: "Pendientes", val: pendingCount, color: "#f59e0b" },
            { label: "Aprobadas", val: approvedCount, color: "#10b981" },
            { label: "Rechazadas", val: rejectedCount, color: "#ef4444" },
          ].map((s, i) => (
            <div key={i} style={{ background: "#ffffff06", border: `1px solid ${s.color}20`, borderRadius: 14, padding: "10px 6px", textAlign: "center" }}>
              <p style={{ fontFamily: "'DM Sans',sans-serif", color: s.color, fontSize: 20, fontWeight: 800 }}>{s.val}</p>
              <p style={{ color: "#64748b", fontSize: 10, marginTop: 2 }}>{s.label}</p>
            </div>
          ))}
        </div>
      </div>




      {/* Main tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid #ffffff10" }}>
        <button onClick={() => setMasterTab("owners")} style={{
          flex: 1, padding: "14px 0", background: "none", border: "none",
          borderBottom: masterTab === "owners" ? "2px solid #8b5cf6" : "2px solid transparent",
          color: masterTab === "owners" ? "#8b5cf6" : "#64748b",
          fontSize: 13, fontWeight: masterTab === "owners" ? 700 : 400,
          cursor: "pointer", fontFamily: "'DM Sans',sans-serif", transition: "all .2s",
        }}>{"🏠 Propietarios"}</button>
        <button onClick={() => setMasterTab("visitors")} style={{
          flex: 1, padding: "14px 0", background: "none", border: "none",
          borderBottom: masterTab === "visitors" ? "2px solid #8b5cf6" : "2px solid transparent",
          color: masterTab === "visitors" ? "#8b5cf6" : "#64748b",
          fontSize: 13, fontWeight: masterTab === "visitors" ? 700 : 400,
          cursor: "pointer", fontFamily: "'DM Sans',sans-serif", transition: "all .2s",
        }}>{"👤 Visitantes"}</button>
      </div>

      {/* VISITANTES PANEL */}
      {masterTab === "visitors" && (
        <div style={{ padding: "20px 24px" }}>
          <div style={{ position: "relative", marginBottom: 16 }}>
            <input
              placeholder="Buscar nombre, correo, ciudad o telefono..."
              value={visitorSearch}
              onChange={e => setVisitorSearch(e.target.value)}
              style={{ width: "100%", background: "#ffffff08", border: "1px solid #ffffff15", borderRadius: 14, padding: "12px 36px 12px 14px", color: "white", fontSize: 13, fontFamily: "'DM Sans',sans-serif", outline: "none" }}
            />
            {visitorSearch.length > 0 && (
              <button onClick={() => setVisitorSearch("")} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#64748b", fontSize: 18, cursor: "pointer", lineHeight: 1 }}>{"×"}</button>
            )}
          </div>

          <p style={{ color: "#64748b", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>
            {filteredVisitors.length} de {MOCK_VISITORS.length} visitantes
          </p>

          {filteredVisitors.length === 0 && (
            <div style={{ background: "#ffffff06", border: "1px solid #ffffff10", borderRadius: 16, padding: "32px", textAlign: "center" }}>
              <p style={{ color: "#64748b", fontSize: 13 }}>Sin resultados</p>
            </div>
          )}

          {filteredVisitors.map((v) => {
            const statusColor = v.status === "verificado" ? "#10b981" : v.status === "pendiente" ? "#f59e0b" : "#64748b";
            const statusBg = v.status === "verificado" ? "#10b98120" : v.status === "pendiente" ? "#f59e0b20" : "#ffffff10";
            const statusLabel = v.status === "verificado" ? "Verificado" : v.status === "pendiente" ? "Pendiente" : "Inactivo";
            return (
              <div key={v.id} style={{ background: "#ffffff06", border: "1px solid #ffffff10", borderRadius: 16, padding: "14px", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <div style={{ width: 40, height: 40, borderRadius: "50%", background: "linear-gradient(135deg, #3b82f6, #6366f1)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <span style={{ color: "white", fontSize: 15, fontWeight: 700 }}>{v.name.charAt(0)}</span>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ color: "white", fontSize: 13, fontWeight: 700 }}>{v.name}</p>
                    <p style={{ color: "#93c5fd", fontSize: 11, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{v.email}</p>
                  </div>
                  <span style={{ background: statusBg, border: "1px solid " + statusColor + "40", borderRadius: 99, padding: "3px 8px", color: statusColor, fontSize: 10, fontWeight: 700, flexShrink: 0 }}>
                    {statusLabel}
                  </span>
                  <button onClick={() => setConfirmDeleteVisitor(v)} style={{ width: 28, height: 28, borderRadius: "50%", background: "#ef444415", border: "1px solid #ef444430", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
                    </svg>
                  </button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                  <div style={{ background: "#ffffff05", borderRadius: 8, padding: "7px 10px" }}>
                    <p style={{ color: "#475569", fontSize: 9, fontWeight: 700, marginBottom: 2 }}>TELEFONO</p>
                    <p style={{ color: "#cbd5e1", fontSize: 12 }}>{v.phone}</p>
                  </div>
                  <div style={{ background: "#ffffff05", borderRadius: 8, padding: "7px 10px" }}>
                    <p style={{ color: "#475569", fontSize: 9, fontWeight: 700, marginBottom: 2 }}>CIUDAD</p>
                    <p style={{ color: "#cbd5e1", fontSize: 12 }}>{v.city}</p>
                  </div>
                  <div style={{ background: "#ffffff05", borderRadius: 8, padding: "7px 10px" }}>
                    <p style={{ color: "#475569", fontSize: 9, fontWeight: 700, marginBottom: 2 }}>REGISTRO</p>
                    <p style={{ color: "#cbd5e1", fontSize: 12 }}>{v.joined}</p>
                  </div>
                  <div style={{ background: "#ffffff05", borderRadius: 8, padding: "7px 10px" }}>
                    <p style={{ color: "#475569", fontSize: 9, fontWeight: 700, marginBottom: 2 }}>SOLICITUDES</p>
                    <p style={{ color: v.solicitudes > 0 ? "#3b82f6" : "#64748b", fontSize: 12, fontWeight: 700 }}>{v.solicitudes}</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Delete visitor confirmation popup */}
      {confirmDeleteVisitor && (
        <div style={{ position: "fixed", inset: 0, background: "#00000090", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 300, padding: "0 0 24px" }}>
          <div style={{ background: "#0d1f3c", borderRadius: 24, padding: "28px 24px", width: "100%", maxWidth: 400, margin: "0 16px", boxShadow: "0 -8px 40px #00000080" }}>
            <div style={{ width: 48, height: 48, borderRadius: "50%", background: "#ef444420", border: "1px solid #ef444440", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
            </div>
            <h3 style={{ color: "white", fontSize: 16, fontWeight: 700, textAlign: "center", marginBottom: 6, fontFamily: "'DM Sans',sans-serif" }}>Eliminar visitante</h3>
            <p style={{ color: "#94a3b8", fontSize: 13, textAlign: "center", lineHeight: 1.6, marginBottom: 6 }}>{confirmDeleteVisitor.name}</p>
            <p style={{ color: "#64748b", fontSize: 12, textAlign: "center", lineHeight: 1.6, marginBottom: 24 }}>Esta accion eliminara permanentemente el perfil y todos sus datos.</p>
            <button onClick={() => { setVisitors(prev => prev.filter(x => x.id !== confirmDeleteVisitor.id)); setConfirmDeleteVisitor(null); }} style={{ width: "100%", background: "#ef4444", border: "none", borderRadius: 14, padding: "15px", color: "white", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", marginBottom: 10 }}>
              Eliminar perfil
            </button>
            <button onClick={() => setConfirmDeleteVisitor(null)} style={{ width: "100%", background: "transparent", border: "1px solid #ffffff15", borderRadius: 14, padding: "13px", color: "#64748b", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>
              Cancelar
            </button>
          </div>
        </div>
      )}

      {/* PROPIETARIOS PANEL */}
      {masterTab === "owners" && (
        <div>
          {/* Filter tabs */}
          <div style={{ display: "flex", padding: "0 24px", borderBottom: "1px solid #ffffff10", overflowX: "auto" }}>
            {[["todas","Todas"],["pendiente","Pendientes"],["aprobada","Aprobadas"],["rechazada","Rechazadas"]].map(([key, label]) => (
              <button key={key} onClick={() => setFilter(key)} style={{
                flex: 1, minWidth: 70, padding: "12px 0", background: "none", border: "none",
                borderBottom: `2px solid ${filter === key ? "#8b5cf6" : "transparent"}`,
                color: filter === key ? "#8b5cf6" : "#64748b",
                fontSize: 11, fontWeight: filter === key ? 700 : 400,
                cursor: "pointer", fontFamily: "'DM Sans',sans-serif", transition: "all .2s",
              }}>{label}</button>
            ))}
          </div>
          {/* Property list */}
          <div style={{ padding: "20px 24px" }}>
        {filtered.map(p => (
          <button key={p.id} onClick={() => setSelected(p)} style={{
            width: "100%", background: "#ffffff06",
            border: `1px solid ${p.status === "aprobada" ? "#10b98120" : "#f59e0b20"}`,
            borderRadius: 20, overflow: "hidden", marginBottom: 14,
            display: "flex", cursor: "pointer", textAlign: "left",
          }}>
            <img src={p.img} alt={p.name} style={{ width: 100, height: 100, objectFit: "cover", flexShrink: 0 }} />
            <div style={{ padding: "12px 14px", flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 3 }}>
                <p style={{ fontFamily: "'Syne',sans-serif", color: "white", fontSize: 14, fontWeight: 700, lineHeight: 1.2, flex: 1, marginRight: 8 }}>{p.name}</p>
                <span style={{
                  background: p.status === "aprobada" ? "#10b98115" : p.status === "rechazada" ? "#ef444415" : "#f59e0b15",
                  border: `1px solid ${p.status === "aprobada" ? "#10b98140" : p.status === "rechazada" ? "#ef444440" : "#f59e0b40"}`,
                  borderRadius: 99, padding: "2px 8px",
                  color: p.status === "aprobada" ? "#10b981" : p.status === "rechazada" ? "#ef4444" : "#f59e0b",
                  fontSize: 10, fontWeight: 700, flexShrink: 0,
                }}>
                  {p.status === "aprobada" ? "Aprobada" : p.status === "rechazada" ? "Rechazada" : "Pendiente"}
                </span>
              </div>
              <p style={{ color: "#64748b", fontSize: 12, marginBottom: 4 }}>👤 {p.owner}</p>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <p style={{ fontFamily: "'Syne',sans-serif", color: "#8b5cf6", fontSize: 14, fontWeight: 700 }}>
                  {`$${p.price.toLocaleString()}`}<span style={{ color: "#64748b", fontSize: 10, fontWeight: 400 }}>/mes</span>
                </p>
                <span style={{ color: "#64748b", fontSize: 11 }}>{p.city}</span>
              </div>
              {/* Gestión badge */}
              <span style={{
                display: "inline-flex", alignItems: "center", gap: 4,
                background: p._mode === "managed" ? "#3b82f615" : "#f59e0b15",
                border: "1px solid " + (p._mode === "managed" ? "#3b82f640" : "#f59e0b40"),
                borderRadius: 99, padding: "2px 8px",
                color: p._mode === "managed" ? "#3b82f6" : "#f59e0b",
                fontSize: 9, fontWeight: 700,
              }}>
                {p._mode === "managed" ? "🛎️ Gestión Baja Renta" : "👤 Autogestión"}
              </span>
            </div>
          </button>
        ))}
        {filtered.length === 0 && (
          <div style={{ textAlign: "center", padding: "48px 0" }}>
            <p style={{ fontSize: 32, marginBottom: 8 }}>🏠</p>
            <p style={{ color: "#64748b", fontSize: 14 }}>Sin propiedades en esta categoría</p>
          </div>
        )}
          </div>
        </div>
      )}
    </div>
  );
}

function SuccessScreen({ onRestart }) {
  return (
    <div style={{ minHeight: "100vh", background: "#0a0f1e", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, textAlign: "center" }}>
      <div style={{ width: 100, height: 100, borderRadius: "50%", background: "linear-gradient(135deg, #10b981, #059669)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24, boxShadow: "0 0 50px #10b98150" }}>
        <Icon name="check" size={48} color="white" />
      </div>
      <h2 style={{ fontFamily: "'Syne',sans-serif", color: "white", fontSize: 28, fontWeight: 800, marginBottom: 8 }}>¡Pago exitoso!</h2>
      <p style={{ color: "#64748b", fontSize: 15, marginBottom: 40, maxWidth: 300 }}>Tu reserva ha sido confirmada. Recibirás los detalles de tu contrato por correo.</p>
      <button onClick={onRestart} className="btn-glow" style={{
        background: "linear-gradient(135deg, #3b82f6, #6366f1)", border: "none", borderRadius: 16,
        padding: "16px 40px", color: "white", fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
      }}>Volver al inicio</button>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────

function App() {

  const [screen, setScreen] = useState("splash");
  const [darkMode, setDarkMode] = useState(true);
  const [profile, setProfile] = useState(null);
  const [currentUser, setCurrentUser] = useState({ name: "", email: "", phone: "" });
  const [paymentSuccess, setPaymentSuccess] = useState(false);
  const [publishedProperties, setPublishedProperties] = useState([...PROPERTIES]);

  // Load approved properties from Supabase — show them FIRST
  useEffect(function() {
    fetch("https://uwtclxtywhthwecsqeug.supabase.co/rest/v1/properties?status=eq.approved&select=*&order=created_at.desc", {
      headers: {
        "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dGNseHR5d2h0aHdlY3NxZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTE1NDQsImV4cCI6MjA5NjYyNzU0NH0.wQ-I3d1P_FaPe4kq2mV_Nm_j7hE7PUOdx_VKVxl7PQQ",
        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dGNseHR5d2h0aHdlY3NxZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTE1NDQsImV4cCI6MjA5NjYyNzU0NH0.wQ-I3d1P_FaPe4kq2mV_Nm_j7hE7PUOdx_VKVxl7PQQ",
      },
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (!Array.isArray(data) || data.length === 0) return;
      var supaApproved = data.map(function(p) {
        return {
          id: p.id,
          name: p.name || "Propiedad",
          city: p.city || "Tijuana",
          state: "Baja California",
          address: p.address || "—",
          price: p.price || 0,
          deposit: p.deposit || 0,
          type: p.type || "Casa",
          bedrooms: p.bedrooms || 0,
          bathrooms: p.bathrooms || 0,
          floors: p.floors || 1,
          parking: p.parking || "Privado",
          pool: p.pool || false,
          petFriendly: p.pet_friendly || false,
          kidsAllowed: p.kids_allowed !== false,
          livingRoom: p.living_room !== false,
          diningRoom: p.dining_room || false,
          kitchen: p.kitchen !== false,
          laundry: p.laundry || false,
          patio: p.patio || false,
          img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=400&q=80",
          images: ["https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=400&q=80"],
          owner: "Propietario",
          ownerPhone: "",
          ownerEmail: p.owner_email || "",
          views: 0,
          likes: 0,
          applicants: [],
          isMock: false,
        };
      });
      // Show Supabase properties FIRST, then mocks
      setPublishedProperties(supaApproved.concat(PROPERTIES));
    }).catch(function(e) { console.log("approved properties fetch error:", e); });
  }, []);
  const [ownerSubmissions, setOwnerSubmissions] = useState([]);

  // Check URL for payment result on load
  useEffect(function() {
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get("payment") === "success") {
        setPaymentSuccess(true);
        // Clean URL
        window.history.replaceState({}, "", window.location.pathname);
      }
    } catch(e) {}
  }, []);
  // Owner submits -> goes to pending review (NOT published yet)
  const addProperty = (p) => {
    setOwnerSubmissions(prev => [...prev, { 
      ...p, 
      _status: "pendiente",
      _ownerName: currentUser.name || "Propietario",
      _ownerEmail: currentUser.email || "",
    }]);
  };
  // Master approves -> property becomes visible to visitors
  const approveProperty = (id) => {
    setOwnerSubmissions(prev => prev.map(p => p.id === id ? { ...p, _status: "aprobada" } : p));
    const prop = ownerSubmissions.find(p => p.id === id);
    if (prop) setPublishedProperties(prev => [...prev, prop]);
  };

  // Owner listed properties with live applicant submissions from visitors
  const [listedProperties, setListedProperties] = useState([]);
  const addApplicant = (propertyId, applicant) => {
    // Save application to Supabase
    fetch("https://uwtclxtywhthwecsqeug.supabase.co/rest/v1/applications", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dGNseHR5d2h0aHdlY3NxZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTE1NDQsImV4cCI6MjA5NjYyNzU0NH0.wQ-I3d1P_FaPe4kq2mV_Nm_j7hE7PUOdx_VKVxl7PQQ",
        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dGNseHR5d2h0aHdlY3NxZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTE1NDQsImV4cCI6MjA5NjYyNzU0NH0.wQ-I3d1P_FaPe4kq2mV_Nm_j7hE7PUOdx_VKVxl7PQQ",
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({
        property_id: typeof propertyId === "string" && propertyId.includes("-") ? propertyId : null,
        property_name: applicant.propertyName || "",
        visitor_name: applicant.name || "",
        visitor_email: applicant.email || "",
        visitor_phone: applicant.phone || "",
        job_title: applicant.job || "",
        monthly_income: parseInt(applicant.income) || 0,
        status: "pending",
      }),
    }).catch(function(e) { console.log("application save error:", e); });

    // Also update local state
    setListedProperties(prev => prev.map(p =>
      p.id === propertyId
        ? { ...p, applicants: [...p.applicants, {
            ...applicant,
            id: Date.now(),
            status: "Necesita revisión",
            docs: { ine: true, comprobante: true, estadoCuenta: true },
          }] }
        : p
    ));
  };
  const [filterStep, setFilterStep] = useState(0);
  const [filters, setFilters] = useState({});
  const [cardIdx, setCardIdx] = useState(0);
  const [likedProperty, setLikedProperty] = useState(null);

  // ── Sound System (Web Audio API) ──
  const playSound = (type) => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const g = ctx.createGain();
      g.connect(ctx.destination);

      if (type === "click") {
        const o = ctx.createOscillator();
        o.connect(g);
        o.type = "sine";
        o.frequency.setValueAtTime(600, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        o.start(ctx.currentTime);
        o.stop(ctx.currentTime + 0.08);

      } else if (type === "success") {
        [0, 0.12, 0.24].forEach((t, i) => {
          const o = ctx.createOscillator();
          o.connect(g);
          o.type = "sine";
          const freqs = [523, 659, 784];
          o.frequency.setValueAtTime(freqs[i], ctx.currentTime + t);
          g.gain.setValueAtTime(0.18, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.2);
        });

      } else if (type === "like") {
        const o = ctx.createOscillator();
        o.connect(g);
        o.type = "sine";
        o.frequency.setValueAtTime(440, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.15);
        g.gain.setValueAtTime(0.2, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        o.start(ctx.currentTime);
        o.stop(ctx.currentTime + 0.2);

      } else if (type === "dislike") {
        const o = ctx.createOscillator();
        o.connect(g);
        o.type = "sine";
        o.frequency.setValueAtTime(350, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        o.start(ctx.currentTime);
        o.stop(ctx.currentTime + 0.15);

      } else if (type === "error") {
        [0, 0.1].forEach((t) => {
          const o = ctx.createOscillator();
          o.connect(g);
          o.type = "square";
          o.frequency.setValueAtTime(180, ctx.currentTime + t);
          g.gain.setValueAtTime(0.1, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.09);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.09);
        });

      } else if (type === "swoosh") {
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1200;
        src.connect(filter);
        filter.connect(g);
        g.gain.setValueAtTime(0.12, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        src.start(ctx.currentTime);
      }
    } catch(e) {}
  };

  const handleProfileSelect = (p) => {
    playSound("swoosh");
    setProfile(p);
    if (p === "owner") setScreen("owner");
    else if (p === "master") setScreen("masterLogin");
    else if (p === "guest") setScreen("guestFilter");
    else if (p === "visitor") setScreen("visitorRegister");
    else if (p === "login") setScreen("login");
    else setScreen("filter");
  };

  const handleFilterAnswer = (ans) => { playSound("click"); setFilters(f => ({ ...f, ...ans })); };

  const handleFilterNext = () => {
    if (filterStep < FILTER_STEPS.length - 1) { playSound("swoosh"); setFilterStep(s => s + 1); }
    else { playSound("success"); setScreen("cards"); }
  };

  const handleFilterBack = () => {
    playSound("click");
    if (filterStep > 0) setFilterStep(s => s - 1);
    else setScreen("profile");
  };

  const handleLike = (property) => {
    playSound("like");
    setLikedProperty(property);
    setScreen("detail");
  };

  const handleDislike = () => {
    playSound("dislike");
    if (cardIdx < PROPERTIES.length - 1) setCardIdx(i => i + 1);
    else { setCardIdx(0); }
  };

  const restart = () => {
    setScreen("splash"); setProfile(null); setFilterStep(0);
    setFilters({}); setCardIdx(0); setLikedProperty(null);
  };

  if (paymentSuccess) return (
    <div style={{ minHeight: "100vh", background: "#0a0f1e", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ textAlign: "center", maxWidth: 340 }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>🎉</div>
        <h2 style={{ color: "white", fontFamily: "'Syne',sans-serif", fontSize: 24, fontWeight: 800, marginBottom: 8 }}>¡Pago exitoso!</h2>
        <p style={{ color: "#94a3b8", fontSize: 14, lineHeight: 1.7, marginBottom: 8 }}>
          Tu pago de <strong style={{ color: "#10b981" }}>$500 MXN</strong> fue procesado correctamente.
        </p>
        <p style={{ color: "#64748b", fontSize: 13, lineHeight: 1.6, marginBottom: 28 }}>
          Recibirás un recibo por correo. El equipo de Baja Renta revisará tu propiedad en 24–72 horas y recibirás una notificación cuando esté publicada.
        </p>
        <button onClick={function() { setPaymentSuccess(false); setScreen("owner"); }} className="btn-glow" style={{
          width: "100%", background: "linear-gradient(135deg,#f59e0b,#d97706)",
          border: "none", borderRadius: 16, padding: "16px", color: "white",
          fontSize: 16, fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
        }}>
          🏠 Ir a mi dashboard
        </button>
      </div>
    </div>
  );

  if (screen === "splash") return <SplashScreen onStart={() => { playSound("click"); setScreen("profile"); }} />;
  if (screen === "profile") return <ProfileSelect onSelect={handleProfileSelect} darkMode={darkMode} />;
  if (screen === "masterLogin") return <LoginScreen onBack={() => setScreen("profile")} onLogin={() => setScreen("profile")} onMasterLogin={() => setScreen("master")} onRegister={() => setScreen("profile")} darkMode={darkMode} />;
  if (screen === "login") return <LoginScreen onBack={() => setScreen("profile")} onLogin={() => setScreen("cards")} onMasterLogin={() => setScreen("master")} onRegister={() => setScreen("visitorRegister")} darkMode={darkMode} />;
  if (screen === "visitorRegister") return <VisitorRegister onBack={() => setScreen("profile")} onComplete={(userData) => { if (userData) setCurrentUser(userData); setScreen("filter"); }} onLogin={() => setScreen("login")} darkMode={darkMode} />;
  if (screen === "guestFilter") return <GuestFilter onBack={() => setScreen("profile")} onContinue={(f) => { setFilters(f); setScreen("catalog"); }} />;
  if (screen === "catalog") return <GuestCatalog filters={filters} properties={publishedProperties} onBack={() => setScreen("guestFilter")} onRegister={() => setScreen("visitorRegister")} />;
  if (screen === "filter") return (
    <FilterSlide
      key={filterStep}
      step={FILTER_STEPS[filterStep]}
      stepIndex={filterStep}
      total={FILTER_STEPS.length}
      filters={filters}
      onAnswer={handleFilterAnswer}
      onNext={handleFilterNext}
      onBack={handleFilterBack}
      darkMode={darkMode}
    />
  );
  if (screen === "settings") return <SettingsScreen onBack={() => setScreen("cards")} onSignOut={() => setScreen("profile")} darkModeProp={darkMode} onToggleTheme={() => setDarkMode(v => !v)} onChangePassword={() => setScreen("changePassword")} onHelp={() => setScreen("help")} currentUser={currentUser} />;
  if (screen === "changePassword") return <ChangePasswordScreen onBack={() => setScreen("settings")} darkMode={darkMode} />;
  if (screen === "help") return <HelpScreen onBack={() => setScreen("settings")} darkMode={darkMode} />;
  if (screen === "cards") return (
    <PropertyCard
      property={publishedProperties[cardIdx % publishedProperties.length]}
      onLike={handleLike}
      onDislike={handleDislike}
      onSettings={() => setScreen("settings")}
      onFilter={() => { setFilterStep(0); setFilters({}); setScreen("filter"); }}
      darkMode={darkMode}
    />
  );
  if (screen === "detail" && likedProperty) return (
    <PropertyDetail
      property={likedProperty}
      onBack={() => setScreen("cards")}
      onRent={() => setScreen("success")}
      onSubmitApplication={(applicant) => addApplicant(likedProperty.id, applicant)}
      darkMode={darkMode}
    />
  );
  if (screen === "owner") return <OwnerPanel onBack={() => setScreen("profile")} onPublish={addProperty} listedProperties={listedProperties} darkModeProp={darkMode} onToggleTheme={() => setDarkMode(v => !v)} currentUser={currentUser} onSetUser={setCurrentUser} />;
  if (screen === "success") return <SuccessScreen onRestart={restart} />;
  if (screen === "master") return <MasterDashboard onBack={() => setScreen("profile")} publishedProperties={ownerSubmissions} onApproveProperty={approveProperty} />;
  return null;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
